name: Bug report
description: Report a reproducible Runquay problem without private data
body:
  - type: markdown
    attributes:
      value: Do not attach auth files, raw private logs, personal paths, or account identifiers. Report security issues privately.
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python version, tool and CLI version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction with synthetic data
