name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies outside the source tree
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/runquay-browser" playwright
          "$RUNNER_TEMP/runquay-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise the actual dashboard with fictional data
        env:
          NODE_PATH: ${{ runner.temp }}/runquay-browser/node_modules
        run: python tests/browser_smoke.py
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/setup.js
      - run: node --check web/beginner.js
      - run: node --check web/ui.js
      - run: node --check web/learnings.js
      - run: node --check web/workspace.js
      - run: node --check web/field.js
      - run: node --test tests/ui.test.js
      - name: Check Windows first-launch setup without installing
        if: runner.os == 'Windows'
        run: |
          cmd /c setup.cmd --check
          powershell.exe -NoProfile -File Setup-Runquay.ps1 -CheckOnly
      - name: Check Unix first-launch setup without installing
        if: runner.os != 'Windows'
        run: sh setup.sh --check
      - run: python runquay.py release --check
      - run: python runquay.py release
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.os }}-${{ matrix.python }}
          path: dist/runquay-*-source.zip*
